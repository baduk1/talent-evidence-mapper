services:
  # 1. Бэкенд-приложение. Конфигурируется через env_file, исходники
  #    подключены volume'ом (правим локально - контейнер видит сразу).
  #    Наружу порты не пробрасывает: снаружи до него достукивается
  #    только web-proxy.
  app:
    build: ./app
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app/src
    expose:
      - "8000"
    depends_on:
      - database
      - rabbitmq
    restart: on-failure

  # 2. Обратный прокси на образе Nginx. Зависит от app и единственный
  #    публикует наружу порты 80 и 443.
  web-proxy:
    build: ./web-proxy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    restart: on-failure

  # 3. Брокер сообщений. 5672 - AMQP, 15672 - веб-админка, 15692 -
  #    prometheus-метрики очередей. Данные на volume'е, чтобы очереди
  #    переживали перезапуск. restart: on-failure - перезагружаться при сбоях.
  rabbitmq:
    build: ./monitoring/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    restart: on-failure

  # 4. База данных на образе postgres. Данные на volume'е, чтобы
  #    переживали удаление контейнера.
  database:
    image: postgres:16
    env_file:
      - ./app/.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: on-failure

  # 5. ML-воркер. Слушает очередь RabbitMQ и обрабатывает задачи.
  #    Контекст сборки - корень: воркер переиспользует пакет tem из app/src.
  #    Запуск нескольких копий: docker-compose up -d --scale ml_worker=2
  ml_worker:
    build:
      context: .
      dockerfile: ml_worker/Dockerfile
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app/src
    depends_on:
      - database
      - rabbitmq
    restart: on-failure

  # 6. Telegram-бот (aiogram, asyncio). Третий интерфейс наравне с вебом
  #    и REST: регистрация по telegram id, баланс, предсказания, история.
  #    Нужен TELEGRAM_BOT_TOKEN в app/.env.
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app/src
    depends_on:
      - database
      - rabbitmq
    restart: on-failure

  # 7. Prometheus: собирает метрики приложения (/metrics) и RabbitMQ.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: on-failure

  # 8. Grafana: дашборд поверх Prometheus (admin/admin, провижининг из
  #    monitoring/grafana/provisioning).
  grafana:
    image: grafana/grafana:11.2.2
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: on-failure