events {}

http {
    # Встроенный DNS Docker: переразрешаем имя app каждые 10 секунд.
    # Со статическим upstream nginx резолвит имя один раз при старте и
    # после пересоздания контейнеров стучится на чужой/старый IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Обычный HTTP на 80 порту
    server {
        listen 80;
        server_name _;

        location / {
            # Переменная в proxy_pass: резолв при обращении по TTL резолвера,
            # а не один раз за жизнь процесса.
            set $app_upstream http://app:8000;
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS на 443 с self-signed сертификатом, сгенерированным при сборке
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/self.crt;
        ssl_certificate_key /etc/nginx/certs/self.key;

        location / {
            set $app_upstream http://app:8000;
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
