[project]
name = "talent-evidence-mapper"
version = "0.1.0"
description = "Domain object model for the Talent Evidence Mapper ML service (assignment 1)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]