{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <section class="card auth-card">
    <h1>{{ s.login_title }}</h1>
    <form method="post" action="/login" class="form">
      <label class="field">
        <span class="field-label">{{ s.email }}</span>
        <input type="email" name="email" required>
      </label>
      <label class="field">
        <span class="field-label">{{ s.password }}</span>
        <input type="password" name="password" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit">{{ s.login_btn }}</button>
    </form>
    <p class="auth-alt">{{ s.no_account }} <a href="/signup">{{ s.signup_btn }}</a></p>
  </section>
</div>
{% endblock %}
